# CI for a machine without a Mac (README "Getting it on an iPhone", way B). Jobs:
#   ui-tests       (every push touching "Evoker iOS/"): builds the app, runs it in the iOS Simulator through the
#                  EvokerUITests target (screens, card drags, a quest and a fight) and uploads the screenshots as
#                  the artifact "ui-screenshots".
#   core-tests     (manual run): the EvokerCore `swift test` suite (also runnable on Windows, see README).
#   unsigned-ipa   (manual run): an unsigned Release device build, artifact "Evoker-unsigned-ipa", to sideload
#                  with AltStore / Sideloadly and a free Apple ID.
# Manual runs: GitHub ▸ Actions ▸ "iOS build and tests" ▸ Run workflow (choose which jobs), or
#   gh workflow run ios.yml -f ipa=true -f core=true
# macOS runner minutes count 10x against the free quota of a private repository, hence the split.
#
# The workflow file must stay at the repository root (.github/workflows/); "Evoker iOS/.github/workflows/ios.yml"
# is a copy kept next to the project for documentation.
name: iOS build and tests

on:
  push:
    paths:
      - "Evoker iOS/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      ui:
        description: "Run the simulator UI tests"
        type: boolean
        default: true
      core:
        description: "Run the EvokerCore swift tests"
        type: boolean
        default: false
      ipa:
        description: "Build the unsigned .ipa"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: Simulator UI tests and screenshots
    if: github.event_name == 'push' || inputs.ui
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XC" ] && [ -d "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Data, assets and project check
        working-directory: "Evoker iOS"
        run: |
          node Tools/sync-data.mjs
          node Tools/build-assets.mjs --no-svg
          node Tools/check-pbxproj.mjs
      - name: Pick a simulator
        id: sim
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          pref = ["iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro"]
          best = None
          for runtime, devs in d.items():
              if "iOS" not in runtime:
                  continue
              for dv in devs:
                  name = dv["name"]
                  rank = pref.index(name) if name in pref else (50 if name.startswith("iPhone") else None)
                  if rank is None:
                      continue
                  key = (rank, runtime)
                  if best is None or key < best[0]:
                      best = (key, dv["udid"], name, runtime)
          print(best[1]); print(best[2], best[3], file=sys.stderr)
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
      - name: xcodebuild test (EvokerUITests)
        working-directory: "Evoker iOS"
        run: |
          set -o pipefail
          xcodebuild \
            -project Evoker.xcodeproj \
            -scheme Evoker \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -only-testing:EvokerUITests \
            OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors' \
            test 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "error:|Test Case|BUILD|TEST|failed|passed" || true
          grep -q "TEST SUCCEEDED\|TEST FAILED" "$RUNNER_TEMP/test.log"
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          if [ -d "$RUNNER_TEMP/ui.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/shots" || true
          fi
          cp "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/shots/" 2>/dev/null || true
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 15m --style compact --predicate 'process == "Evoker"' > "$RUNNER_TEMP/shots/app-log.txt" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/shots" | head -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7

  core-tests:
    name: EvokerCore tests (swift test)
    if: github.event_name == 'workflow_dispatch' && inputs.core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XC" ] && [ -d "$XC" ]; then sudo xcode-select -s "$XC"; fi
          swift --version
      - name: swift test
        working-directory: "Evoker iOS/EvokerCore"
        run: swift test

  unsigned-ipa:
    name: Unsigned .ipa (Release, device)
    if: github.event_name == 'workflow_dispatch' && inputs.ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XC" ] && [ -d "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Data and assets
        working-directory: "Evoker iOS"
        run: |
          node Tools/sync-data.mjs
          node Tools/build-assets.mjs --no-svg
      - name: xcodebuild archive (unsigned)
        working-directory: "Evoker iOS"
        run: |
          set -o pipefail
          xcodebuild \
            -project Evoker.xcodeproj \
            -scheme Evoker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Evoker.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            archive
      - name: Package Payload/Evoker.app into Evoker-unsigned.ipa
        run: |
          APP="$RUNNER_TEMP/Evoker.xcarchive/Products/Applications/Evoker.app"
          test -d "$APP"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          rm -f Evoker-unsigned.ipa
          zip -qry Evoker-unsigned.ipa Payload
          ls -la Evoker-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Evoker-unsigned-ipa
          path: ${{ runner.temp }}/Evoker-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
