# XcodeGen fallback (https://github.com/yonaskolb/XcodeGen): `brew install xcodegen && xcodegen generate`
# regenerates Evoker.xcodeproj from this file should the hand-written project ever be rejected by Xcode.
# The generated project uses classic groups (not the Xcode 16 synchronized folder) and an Info.plist file that
# XcodeGen writes to Support/Info.plist (see `info.path` below; the hand-written project generates its plist from
# INFOPLIST_KEY_* build settings instead); otherwise the two projects are equivalent. `xcodegen generate` replaces
# the committed Evoker.xcodeproj: restore it from version control to go back to the hand-written one.
#
# Support/Info.plist is deliberately *outside* the Evoker/ folder: in the hand-written project Evoker/ is a
# synchronized folder whose non-source files are copied into the bundle, so a plist in there would collide with
# the generated Info.plist. The file is ignored by .gitignore (generated).
name: Evoker
options:
  bundleIdPrefix: com.guiba
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  EvokerCore:
    path: EvokerCore
targets:
  Evoker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Evoker
        excludes:
          - "**/README.md"
      - path: GameAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: EvokerCore
        product: EvokerCore
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Evoker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.guiba.evoker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
schemes:
  Evoker:
    build:
      targets:
        Evoker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # the test target of the local package (XcodeGen 2.26+: "<package>/<target>")
        - EvokerCore/EvokerCoreTests
    profile:
      config: Release
    archive:
      config: Release
