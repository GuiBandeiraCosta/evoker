# XcodeGen fallback (https://github.com/yonaskolb/XcodeGen): `brew install xcodegen && xcodegen generate`
# regenerates Evoker.xcodeproj from this file should the hand-written project ever be rejected by Xcode.
# The generated project uses classic groups (not the Xcode 16 synchronized folder), otherwise it is equivalent.
name: Evoker
options:
  bundleIdPrefix: com.guiba
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  EvokerCore:
    path: EvokerCore
targets:
  Evoker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Evoker
      - path: GameAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: EvokerCore
    info:
      path: Evoker/Info.plist
      properties:
        CFBundleDisplayName: Evoker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.guiba.evoker
schemes:
  Evoker:
    build:
      targets:
        Evoker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EvokerCoreTests
